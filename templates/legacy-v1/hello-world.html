<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SDK Example</title>
  <script src="https://manaurum.com/sdk/manaurum.js"></script>
  <style>
    /* Adapt to APPEARANCE (light/dark), which varies. Not to ctx.theme — that
       is always 'smoothie' inside an iframe. See theme-aware-app.html. */
    :root { --bg: #f7f7f9; --fg: #0e0f12; --btn2: #e6e6ea; --btn2fg: #333; color-scheme: light; }
    html[data-appearance="dark"] { --bg: #17171a; --fg: #f5f5f7; --btn2: #2a2a30; --btn2fg: #e7e7ea; color-scheme: dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px;
           background: var(--bg); color: var(--fg); }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; margin: 4px; }
    .btn-blue { background: #0a84ff; color: white; }
    .btn-gray { background: var(--btn2); color: var(--btn2fg); }
  </style>
</head>
<body>
  <h1>SDK Example</h1>
  <p id="status">Initializing...</p>
  <div id="actions" style="display:none;">
    <button class="btn btn-blue" onclick="app.setTitle('Updated @ ' + new Date().toLocaleTimeString())">Set Title</button>
    <button class="btn btn-gray" onclick="app.toastSuccess('It works!')">Toast</button>
    <button class="btn btn-gray" onclick="app.toastError('Oops!')">Error Toast</button>
    <button class="btn btn-gray" onclick="app.close()">Close</button>
  </div>

  <script>
    var app = ManaurumSDK.init();

    function applyAppearance(appearance) {
      document.documentElement.dataset.appearance = appearance || 'light';
    }

    app.onReady(function(ctx) {
      applyAppearance(ctx.appearance);
      document.getElementById('status').textContent =
        'Connected! Hello, ' + ctx.user.nickname + ' (appearance: ' + ctx.appearance + ')';
      document.getElementById('actions').style.display = 'block';
    });

    // Correct hook, but the shipped v1 SDK never fires it (MAN-1450): its
    // theme-change handler compares against an alias of the object it just
    // mutated. Appearance is therefore applied once, at onReady above.
    app.onAppearanceChange(applyAppearance);
  </script>
</body>
</html>
