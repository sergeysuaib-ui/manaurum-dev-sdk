<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManAurum Appearance-Aware App (v1)</title>
  <script src="https://manaurum.com/sdk/manaurum.js"></script>
  <!--
    LEGACY v1 TEMPLATE — for maintaining an existing iframe app. New apps go
    on Platform v2; see templates/v2-starter/.

    What "theme-aware" actually means, for v1 and v2 alike:

      ctx.theme       ALWAYS 'smoothie'. The XP look is a desktop-shell
                      easter egg for one tenant and it stops at the window
                      frame — the shell never passes 'xp' into an iframe
                      (MAN-235). Styling for it is dead code.
      ctx.appearance  'light' | 'dark'  ← this is what varies
      ctx.accent      'core-blue' | 'teal' | 'lavender' | 'coral' | 'rose'
                      | 'graphite' | 'amber' | 'green'

    So adapt to APPEARANCE and ACCENT, and ignore theme. The v1 SDK has
    dedicated hooks for exactly these two: onAppearanceChange() and
    onAccentChange(). onThemeChange() also exists, but it only ever hands
    you the constant 'smoothie'.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Light is the default; the dark block below overrides it. One token
       list per appearance, and every rule reads the tokens — so adding an
       appearance never means duplicating a component. */
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --panel: #eeeef1;
      --line: rgba(0, 0, 0, 0.08);
      --text: #0e0f12;
      --text-muted: #5c5f6b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.04);
      --accent: #0a84ff;
      --accent-contrast: #ffffff;
      color-scheme: light;
    }
    html[data-appearance="dark"] {
      --bg: #17171a;
      --card: #212126;
      --panel: #2a2a30;
      --line: rgba(255, 255, 255, 0.10);
      --text: #f5f5f7;
      --text-muted: #9a9da8;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }

    /* The eight OS accents, copied from globals.css so the app matches the
       desktop around it. Anything unrecognised keeps the default above. */
    html[data-accent="core-blue"] { --accent: #0a84ff; --accent-contrast: #fff; }
    html[data-accent="teal"]      { --accent: #5ac8fa; --accent-contrast: #0e0f12; }
    html[data-accent="lavender"]  { --accent: #b49dff; --accent-contrast: #0e0f12; }
    html[data-accent="coral"]     { --accent: #ff9b85; --accent-contrast: #0e0f12; }
    html[data-accent="rose"]      { --accent: #ff6ca0; --accent-contrast: #fff; }
    html[data-accent="graphite"]  { --accent: #8e8e93; --accent-contrast: #fff; }
    html[data-accent="amber"]     { --accent: #f59e0b; --accent-contrast: #0e0f12; }
    html[data-accent="green"]     { --accent: #30d158; --accent-contrast: #0e0f12; }

    body {
      height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .text-muted { color: var(--text-muted); font-size: 13px; }

    .content { flex: 1; overflow-y: auto; padding: 24px; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .label {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
    }

    .input {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--card);
      color: var(--text); font: inherit; outline: none;
    }
    .input:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px; border: none;
      background: var(--accent); color: var(--accent-contrast);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .badges { display: flex; gap: 6px; margin-top: 12px; }
    .badge {
      padding: 2px 8px; border-radius: 9999px;
      font-size: 11px; font-weight: 600;
      background: var(--panel); color: var(--text-muted);
    }
    .badge-success { background: rgba(22, 163, 74, 0.12); color: #16a34a; }
    .badge-info { background: rgba(10, 132, 255, 0.12); color: #0a84ff; }
    html[data-appearance="dark"] .badge-success { color: #30d158; }
    html[data-appearance="dark"] .badge-info { color: #6ea8ff; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">Loading…</h1>
    <p class="text-muted" id="subtitle"></p>
  </div>

  <div class="content">
    <div class="card">
      <div class="label">Example card</div>
      <p>This card follows the OS appearance and accent — try switching either
         in Settings while the app is open.</p>
      <div class="badges">
        <span class="badge badge-success">Active</span>
        <span class="badge badge-info">v1.0</span>
      </div>
    </div>

    <div class="card">
      <div class="label">Input example</div>
      <input class="input" placeholder="Type something…" id="demo-input">
    </div>

    <button class="btn" id="toast-btn">Show toast</button>
  </div>

  <script>
    var sdk = ManaurumSDK.init();
    var root = document.documentElement;

    function applyAppearance(appearance) {
      root.dataset.appearance = appearance || 'light';
      document.getElementById('subtitle').textContent =
        'Appearance: ' + root.dataset.appearance + ' · accent: ' + (root.dataset.accent || '—');
    }

    function applyAccent(accent) {
      if (accent) root.dataset.accent = accent;
      applyAppearance(root.dataset.appearance);
    }

    sdk.onReady(function (ctx) {
      // Note what is NOT read here: ctx.theme. It is always 'smoothie'.
      root.dataset.accent = ctx.accent || 'core-blue';
      applyAppearance(ctx.appearance);
      document.getElementById('title').textContent = 'Hello, ' + ctx.user.nickname + '!';
    });

    // The two signals that actually change while the app is open.
    sdk.onAppearanceChange(applyAppearance);
    sdk.onAccentChange(applyAccent);

    document.getElementById('toast-btn').onclick = function () {
      sdk.toastSuccess('It works!');
    };
  </script>
</body>
</html>
