[pytest]
# `asyncio_mode = auto` lets an `async def test_…` run without decorating
# every one. `pytestmark = pytest.mark.asyncio` in the test module works
# too; pick one and be consistent.
asyncio_mode = auto
# Pin the fixture loop scope explicitly — pytest-asyncio warns on every
# run while it is unset, and a scaffold that warns out of the box trains
# you to ignore warnings.
asyncio_default_fixture_loop_scope = function
testpaths = tests
